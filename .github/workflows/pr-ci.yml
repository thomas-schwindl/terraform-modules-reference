name: PR - Terraform Checks

on:
  pull_request:
    branches: [main]

env:
  TERRAFORM_VERSION: "1.9.0"

jobs:
  pr-checks:
    name: PR Checks (fmt, validate, lint, security, tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Ensure tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq unzip python3-pip
          pip3 install checkov

      - name: Terraform Format
        id: fmt
        run: |
          set -e
          terraform fmt -check -recursive || echo "fmt_failed=true" > fmt_status

      - name: Terraform Init & Validate
        id: validate
        run: |
          set -e
          cd modules/aws/lambda
          terraform init -backend=false -input=false
          terraform validate || echo "validate_failed=true" > validate_status

      - name: Terraform Native Tests
        id: tf_tests
        run: |
          set -e
          cd modules/aws/lambda
          terraform test -json > test-results.json || true
          jq '.runs[] | {name: .name, outcome: .outcome}' test-results.json || true

      - name: TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.48.0

      - name: Run TFLint
        run: |
          tflint --chdir=modules/aws/lambda/ --format=compact || true

      - name: tfsec scan
        uses: aquasecurity/tfsec-action@v1
        with:
          directory: modules/aws/lambda
          format: json
          output-file: modules/aws/lambda/tfsec.json

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: modules/aws/lambda/
          framework: terraform
          soft_fail: true
          output_format: sarif
          output_file: modules/aws/lambda/checkov-results.sarif

      - name: Pre-commit (quick hooks)
        uses: pre-commit/action@v4
        with:
          extra_args: run --all-files

      - name: Aggregate report
        id: report
        run: |
          OUT=pr-report.md
          echo "# PR Terraform Check Report" > $OUT
          echo "" >> $OUT
          echo "## Format" >> $OUT
          if [ -f fmt_status ]; then echo "**Format:** Failed" >> $OUT; else echo "**Format:** Passed" >> $OUT; fi
          echo "" >> $OUT
          echo "## Validate" >> $OUT
          if [ -f modules/aws/lambda/validate_status ]; then echo "**Validate:** Failed" >> $OUT; else echo "**Validate:** Passed" >> $OUT; fi
          echo "" >> $OUT
          echo "## Terraform Tests" >> $OUT
          if [ -f modules/aws/lambda/test-results.json ]; then
            jq -r '.runs[] | "- \(.name): \(.outcome)"' modules/aws/lambda/test-results.json >> $OUT || echo "(could not parse test-results.json)" >> $OUT
          else
            echo "No test results produced." >> $OUT
          fi
          echo "" >> $OUT
          echo "## TFLint (excerpt)" >> $OUT
          tflint --chdir=modules/aws/lambda/ --format=compact | sed -n '1,30p' >> $OUT || echo "(tflint ran with no output)" >> $OUT
          echo "" >> $OUT
          echo "## tfsec (summary)" >> $OUT
          if [ -f modules/aws/lambda/tfsec.json ]; then jq -r '.[] | .result.summary' modules/aws/lambda/tfsec.json 2>/dev/null | sed -n '1,20p' >> $OUT || echo "(tfsec output present)" >> $OUT; else echo "tfsec not run" >> $OUT; fi
          echo "" >> $OUT
          echo "## Checkov" >> $OUT
          if [ -f modules/aws/lambda/checkov-results.sarif ]; then echo "Checkov SARIF generated (see artifact)." >> $OUT; else echo "Checkov not run" >> $OUT; fi
          echo "" >> $OUT
          echo "---" >> $OUT
          echo "Report generated by CI" >> $OUT
          cat $OUT
          echo "report_path=$OUT" >> $GITHUB_OUTPUT

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-ci-report
          path: pr-report.md

      - name: Comment on PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.number }}
          body-file: pr-report.md
