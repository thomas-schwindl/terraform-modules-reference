name: CI - Quality & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.9.0"

jobs:
  # ──────────────────────────────────────────────────────────
  # LEVEL 1: STATIC ANALYSIS
  # ──────────────────────────────────────────────────────────
  # Prüft Format, Syntax, Best Practices, Security
  # Geschwindigkeit: < 60 Sekunden
  # Kosten: $0
  # ──────────────────────────────────────────────────────────
  level-1-static-analysis:
    name: 🔍 Level 1 - Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      # ─── Sub-Level 1.1: Format & Syntax ────────────────────
      - name: L1.1 - Terraform Format Check
        run: terraform fmt -check -recursive
      
      - name: L1.2 - Terraform Validate
        run: |
          cd modules/aws/lambda
          terraform init -backend=false
          terraform validate
      
      # ─── Sub-Level 1.3: TFLint Best Practices ──────────────
      - name: L1.3 - Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.48.0
      
      - name: L1.4 - TFLint Plugins Download
        run: tflint --init
      
      - name: L1.5 - TFLint Scan (AWS Lambda)
        run: |
          cd modules/aws/lambda
          tflint --format=compact
      
      # ─── Sub-Level 1.6: Security Scans ─────────────────────
      - name: L1.6 - Setup Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: modules/aws/lambda/
          framework: terraform
          soft_fail: false
          output_file: checkov-results.sarif
          output_format: sarif
      
      - name: L1.7 - Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-reports
          path: checkov-results.sarif

  # ──────────────────────────────────────────────────────────
  # LEVEL 2: NATIVE MOCK TESTS
  # ──────────────────────────────────────────────────────────
  # Prüft Funktionalität mit Mock Provider (KEINE Cloud)
  # Geschwindigkeit: < 30 Sekunden
  # Kosten: $0
  # ──────────────────────────────────────────────────────────
  level-2-native-tests:
    name: 🧪 Level 2 - Native Mock Tests
    runs-on: ubuntu-latest
    needs: level-1-static-analysis
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: L2.1 - Initialize Module
        run: |
          cd modules/aws/lambda
          terraform init -backend=false
      
      - name: L2.2 - Run Terraform Test
        run: |
          cd modules/aws/lambda
          terraform test -v
        
          # Parse results
          TEST_PASS=$(terraform test -json | jq '.runs[] | select(.outcome == "pass") | .name' | wc -l)
          TEST_FAIL=$(terraform test -json | jq '.runs[] | select(.outcome == "fail") | .name' | wc -l)
        
          echo "Tests Passed: $TEST_PASS"
          echo "Tests Failed: $TEST_FAIL"
        
          if [ "$TEST_FAIL" -gt 0 ]; then
           exit 1
          fi
      
      - name: L2.3 - Parse Test Results
        run: |
          cd modules/aws/lambda
          terraform test -json > test-results.json
          
      - name: L2.4 - Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: terraform-test-results
          path: modules/aws/lambda/test-results.json

  # ──────────────────────────────────────────────────────────
  # LEVEL 3: DOCUMENTATION VALIDATION
  # ──────────────────────────────────────────────────────────
  # Prüft ob Docs aktuell sind
  # ──────────────────────────────────────────────────────────
  level-3-documentation:
    name: 📖 Level 3 - Documentation Check
    runs-on: ubuntu-latest
    needs: level-2-native-tests
    
    steps:
      - uses: actions/checkout@v4
      
      - name: L3.1 - Generate Docs
        uses: terraform-docs/gh-actions@main
        with:
          recursive: true
          output-file: README.md
          output-method: inject
          config-file: ".terraform-docs.yml"
          check_diff: true
      
      - name: L3.2 - Fail if Docs Outdated
        run: |
          if git diff --quiet; then
            echo "✅ Documentation is up-to-date"
          else
            echo "❌ Documentation outdated. Run: terraform-docs"
            exit 1
          fi

  # ──────────────────────────────────────────────────────────
  # LEVEL 4: PLAN & DEPENDENCY CHECK
  # ──────────────────────────────────────────────────────────
  # Simuliert Plan für Abhängigkeiten
  # ──────────────────────────────────────────────────────────
  level-4-plan-validation:
    name: 📋 Level 4 - Plan Validation
    runs-on: ubuntu-latest
    needs: level-3-documentation
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: L4.1 - Initialize for Plan
        run: |
          cd modules/aws/lambda
          terraform init -backend=false
      
      - name: L4.2 - Run Terraform Plan
        run: |
          cd modules/aws/lambda
          terraform plan -out=tfplan -detailed-exitcode
          exit 0  # Ignoriere exit code für Module-only
      
      - name: L4.3 - Check Plan Changes
        run: |
          cd modules/aws/lambda
          terraform show -no-color tfplan > plan-output.txt
          
          # Warnung wenn zu viele Ressourcen
          RESOURCES_CREATED=$(grep -c "+ resource" plan-output.txt || echo "0")
          echo "Resources to be created: $RESOURCES_CREATED"
      
      - name: L4.4 - Upload Plan Output
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-output
          path: modules/aws/lambda/plan-output.txt

  # ──────────────────────────────────────────────────────────
  # FINAL: BUILD SUMMARY
  # ──────────────────────────────────────────────────────────
  build-summary:
    name: ✅ Build Summary
    runs-on: ubuntu-latest
    needs: [level-1-static-analysis, level-2-native-tests, level-3-documentation, level-4-plan-validation]
    if: always()
    
    steps:
      - name: Print Overall Status
        run: |
          echo "╔════════════════════════════════════════╗"
          echo "║     TERRAFORM BLUEPRINT BUILD STATUS   ║"
          echo "╠════════════════════════════════════════╣"
          echo "║ Level 1 - Static Analysis: ${{ needs.level-1-static-analysis.result }}"
          echo "║ Level 2 - Native Mock Tests: ${{ needs.level-2-native-tests.result }}"
          echo "║ Level 3 - Documentation:     ${{ needs.level-3-documentation.result }}"
          echo "║ Level 4 - Plan Validation:   ${{ needs.level-4-plan-validation.result }}"
          echo "╚════════════════════════════════════════╝"