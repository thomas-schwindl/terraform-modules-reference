name: CI - Quality & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.9.0"

jobs:
  # ──────────────────────────────────────────────────────────
  # LEVEL 1: STATIC ANALYSIS
  # ──────────────────────────────────────────────────────────
  level-1-format-check:
    name: 🔍 L1.1 Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Terraform Format
        run: terraform fmt -check -recursive

  level-2-validate:
    name: 🔍 L1.2 Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Terraform Init
        run: |
          cd modules/aws/lambda
          terraform init -backend=false
      - name: Terraform Validate
        run: |
          cd modules/aws/lambda
          terraform validate

  level-3-tflint:
    name: 🔍 L1.3 TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.48.0
      - name: TFLint Init
        run: tflint --init
      - name: TFLint Scan
        run: tflint --chdir=modules/aws/lambda/ --format=compact

  level-4-checkov:
    name: 🔍 L1.4 Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: modules/aws/lambda/
          framework: terraform
          soft_fail: true
          skip_check: CKV2_AWS_5,CKV_AWS_69
          output_format: sarif
          output_file: checkov-results.sarif

  # ──────────────────────────────────────────────────────────
  # LEVEL 1: SUMMARY (Korrigiert mit exit 1)
  # ──────────────────────────────────────────────────────────
  level-1-summary:
    name: ✅ Level 1 Summary
    runs-on: ubuntu-latest
    needs: [level-1-format-check, level-2-validate, level-3-tflint, level-4-checkov]
    if: always()
    steps:
      - name: Check Level 1 Results
        run: |
          echo "╔══════════════════════════════════════╗"
          echo "║     🔍 LEVEL 1: STATIC ANALYSIS      ║"
          echo "╠══════════════════════════════════════╣"
          echo "║  L1.1 Format Check:  ${{ needs.level-1-format-check.result }}"
          echo "║  L1.2 Validate:      ${{ needs.level-2-validate.result }}"
          echo "║  L1.3 TFLint:        ${{ needs.level-3-tflint.result }}"
          echo "║  L1.4 Checkov:       ${{ needs.level-4-checkov.result }}"
          echo "╚══════════════════════════════════════╝"
          
          # ✅ FAIL wenn ein Job nicht success war
          if [[ "${{ needs.level-1-format-check.result }}" != "success" ]] || \
             [[ "${{ needs.level-2-validate.result }}" != "success" ]] || \
             [[ "${{ needs.level-3-tflint.result }}" != "success" ]] || \
             [[ "${{ needs.level-4-checkov.result }}" != "success" ]]; then
            echo "❌ Level 1 Failed!"
            exit 1
          fi
          echo "✅ Level 1 Passed!"

  # ──────────────────────────────────────────────────────────
  # LEVEL 2: NATIVE MOCK TESTS
  # ──────────────────────────────────────────────────────────
  level-2-init:
    name: 🧪 L2.1 Initialize
    runs-on: ubuntu-latest
    needs: level-1-summary
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Terraform Init
        run: |
          cd modules/aws/lambda
          terraform init -backend=false

  level-2-test:
    name: 🧪 L2.2 Run Tests
    runs-on: ubuntu-latest
    needs: level-2-init
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Terraform Test (JSON)
        run: |
          cd modules/aws/lambda
          terraform test -json > test-results.json
          jq '.runs[] | {name: .name, outcome: .outcome}' test-results.json
      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-test-results
          path: modules/aws/lambda/test-results.json

  level-2-parse:
    name: 🧪 L2.3 Parse Results
    runs-on: ubuntu-latest
    needs: level-2-test
    steps:
      - name: Download test results artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-test-results
          path: modules/aws/lambda
      - name: Parse JSON Results
        run: |
          cd modules/aws/lambda
          jq '.runs[] | {name: .name, outcome: .outcome}' test-results.json

  # level-2-upload removed; artifacts are uploaded in level-2-test and downloaded in level-2-parse

  # ──────────────────────────────────────────────────────────
  # LEVEL 2: SUMMARY (Korrigiert mit exit 1)
  # ──────────────────────────────────────────────────────────
  level-2-summary:
    name: ✅ Level 2 Summary
    runs-on: ubuntu-latest
    needs: [level-2-init, level-2-test, level-2-parse]
    if: always()
    steps:
      - name: Check Level 2 Results
        run: |
          echo "╔══════════════════════════════════════╗"
          echo "║   🧪 LEVEL 2: NATIVE MOCK TESTS      ║"
          echo "╠══════════════════════════════════════╣"
          echo "║  L2.1 Initialize:    ${{ needs.level-2-init.result }}"
          echo "║  L2.2 Run Tests:     ${{ needs.level-2-test.result }}"
          echo "║  L2.3 Parse Results: ${{ needs.level-2-parse.result }}"
          echo "╚══════════════════════════════════════╝"
          
          # ✅ FAIL wenn ein Job nicht success war
          if [[ "${{ needs.level-2-init.result }}" != "success" ]] || \
             [[ "${{ needs.level-2-test.result }}" != "success" ]] || \
             [[ "${{ needs.level-2-parse.result }}" != "success" ]]; then
            echo "❌ Level 2 Failed!"
            exit 1
          fi
          echo "✅ Level 2 Passed!"

  # ──────────────────────────────────────────────────────────
  # LEVEL 3: DOCUMENTATION
  # ──────────────────────────────────────────────────────────
  level-3-generate:
    name: 📖 L3.1 Generate Docs
    runs-on: ubuntu-latest
    needs: level-2-summary
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-docs/gh-actions@main
        with:
          recursive: true
          output-file: README.md
          output-method: inject
          config-file: ".terraform-docs.yml"
          check_diff: true

  level-3-summary:
    name: ✅ Level 3 Summary
    runs-on: ubuntu-latest
    needs: level-3-generate
    if: always()
    steps:
      - name: Check Level 3 Results
        run: |
          echo "╔══════════════════════════════════════╗"
          echo "║   📖 LEVEL 3: DOCUMENTATION          ║"
          echo "╠══════════════════════════════════════╣"
          echo "║  L3.1 Generate Docs: ${{ needs.level-3-generate.result }}"
          echo "╚══════════════════════════════════════╝"
          
          # ✅ FAIL wenn Job nicht success war
          if [[ "${{ needs.level-3-generate.result }}" != "success" ]]; then
            echo "❌ Level 3 Failed!"
            exit 1
          fi
          echo "✅ Level 3 Passed!"

  # ──────────────────────────────────────────────────────────
  # FINAL BUILD STATUS (Korrigiert mit exit 1)
  # ──────────────────────────────────────────────────────────
  build-summary:
    name: 🏁 Final Build Status
    runs-on: ubuntu-latest
    needs: [level-1-summary, level-2-summary, level-3-summary]
    if: always()
    steps:
      - name: Print Final Status
        run: |
          echo "╔═══════════════════════════════════════════════════════╗"
          echo "║         TERRAFORM BLUEPRINT BUILD SUMMARY             ║"
          echo "╠═══════════════════════════════════════════════════════╣"
          echo "║ 🔍 LEVEL 1 - Static Analysis: ${{ needs.level-1-summary.result }}"
          echo "║ 🧪 LEVEL 2 - Mock Tests:      ${{ needs.level-2-summary.result }}"
          echo "║ 📖 LEVEL 3 - Documentation:   ${{ needs.level-3-summary.result }}"
          echo "╠═══════════════════════════════════════════════════════╣"
          
          # ✅ FAIL wenn eine Summary nicht success war
          if [[ "${{ needs.level-1-summary.result }}" != "success" ]] || \
             [[ "${{ needs.level-2-summary.result }}" != "success" ]] || \
             [[ "${{ needs.level-3-summary.result }}" != "success" ]]; then
            echo "║ ❌ SOME LEVELS FAILED                             ║"
            echo "╚═══════════════════════════════════════════════════════╝"
            exit 1
          else
            echo "║ ✅ ALL LEVELS PASSED                              ║"
            echo "╚═══════════════════════════════════════════════════════╝"
            exit 0
          fi